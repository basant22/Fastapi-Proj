name: Python application

on:
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

permissions:
  contents: read

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
  - uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5  # Upgraded from v3 for better performance
    with:
      python-version: "3.14"       # Recommend stable release (3.11/3.12) unless testing 3.14 dev
      cache: 'pip'                 # Caches dependencies to make builds much faster

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      # FastAPI testing requires pytest-asyncio (for async endpoints) and httpx (for TestClient)
      pip install flake8 pytest pytest-asyncio httpx
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  - name: Lint with flake8
    run: |
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  # Package the app files into an artifact for deployment
  - name: Upload artifact for deployment job
    uses: actions/upload-artifact@v4
    with:
        name: python-app
        path: .
  - name: Test with pytest
    continue-on-error: true # if ignore test
    env:
      # Pass required environment variables so FastAPI settings initialize properly
      ENVIRONMENT: testing
      SECRET_KEY: test-secret-key-123
    run: |
      pytest
  # -------------------------------------------------------------------
  # Job 2: Deploy to Azure Web App
  # -------------------------------------------------------------------
 deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/feature' && github.event_name == 'push'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E9D68D78E97442D281F3F110AAEEDAA3 }}
        # tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_60155983559D4888B7CE20EC2940B5C9 }}
        # subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BE10279745BC49389CAAE882B5D782B0 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'todos-api'
          slot-name: 'Production'
