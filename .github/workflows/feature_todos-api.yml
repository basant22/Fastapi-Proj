name: Python application

on:
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

permissions:
  contents: read

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
  - uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5  # Upgraded from v3 for better performance
    with:
      python-version: "3.14"       # Recommend stable release (3.11/3.12) unless testing 3.14 dev
      cache: 'pip'                 # Caches dependencies to make builds much faster

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      # FastAPI testing requires pytest-asyncio (for async endpoints) and httpx (for TestClient)
      pip install flake8 pytest pytest-asyncio httpx
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  - name: Lint with flake8
    run: |
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  # Package the app files into an artifact for deployment
  - name: Upload artifact for deployment job
    uses: actions/upload-artifact@v4
    with:
        name: python-app
        path: .
  - name: Test with pytest
    continue-on-error: true # if ignore test
    env:
      # Pass required environment variables so FastAPI settings initialize properly
      ENVIRONMENT: testing
      SECRET_KEY: test-secret-key-123
    run: |
      pytest
  # -------------------------------------------------------------------
  # Job 2: Deploy to Azure Web App
  # -------------------------------------------------------------------
 deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Download the pre-packaged app from the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: todos-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Entry point command required for FastAPI
          startup-command: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app"      